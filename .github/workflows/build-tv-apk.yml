name: Build TV APK

on:
  push:
    branches: [ tv-html, atv/debug-preview-tv-portrait-paysage, atv/simulateur-tv-force, atv/fix-pairing-keep-invitation ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        simulator: ${{ fromJSON(github.ref_name == 'atv/fix-pairing-keep-invitation' && '[false,true]' || (github.ref_name == 'atv/simulateur-tv-force' && '[true]' || '[false]')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Le runner Ubuntu fournit déjà le SDK Android (ANDROID_HOME).
      # setup-android@v3 échouait en cherchant le paquet obsolète 'tools'.
      - name: Install Android platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" || echo "platform 37 indisponible, AGP tentera le téléchargement"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          FORCE_TV_SIMULATOR: ${{ matrix.simulator }}
        run: ./gradlew assembleDebug --stacktrace -PforceTvSimulator="$FORCE_TV_SIMULATOR"

      - name: Find APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"
          ls -la app/build/outputs/apk/debug/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.simulator && 'appteka-tv-simulateur' || 'appteka-tv-debug' }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Release compactée (R8) et signée avec la clé ModProd d'apk-factory.
      # Secrets : ANDROID_KEYSTORE_B64 (.p12 / .keystore en base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
      # ANDROID_KEY_PASSWORD (facultatif : seulement si la clé a un mot de passe différent du fichier).
      - name: Build signed release APK
        if: github.ref_name == 'tv-html'
        id: release
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          if [ -z "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "::warning::Secrets de signature absents : release non construite (ajoute ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS au dépôt)."
            echo "built=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > modprod-release.keystore
          ./gradlew assembleRelease --stacktrace \
            -PstoreFile=modprod-release.keystore \
            -PstorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -PkeyAlias="$ANDROID_KEY_ALIAS" \
            -PkeyPassword="$KEY_PASS"
          rm -f modprod-release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          "$BT/apksigner" verify --print-certs "$APK"
          unzip -l "$APK" | grep -c "classes.*\.dex" | xargs echo "Fichiers dex :"
          ls -la app/build/outputs/apk/release/
          echo "built=true" >> $GITHUB_OUTPUT

      - name: Upload release APK
        if: steps.release.outputs.built == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: appteka-tv-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
