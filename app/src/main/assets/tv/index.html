<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Appteka TV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="safe-area">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-text">Appteka</span><span class="logo-tv">TV</span>
            </div>
            <form class="search-box" id="search-box" tabindex="0" autocomplete="off">
                <span class="search-icon">🔍</span>
                <input id="search-input" class="search-input" type="search" tabindex="-1"
                       enterkeyhint="search" placeholder="Rechercher une application…">
            </form>
        </header>

        <!-- Main content -->
        <main class="content">
            <section class="section" id="section-search" hidden>
                <h2 class="section-title">Résultats <span class="section-count" id="count-search"></span></h2>
                <div class="apps-row" id="row-search" data-key="search"></div>
            </section>
            <section class="section">
                <h2 class="section-title">TV <span class="section-count" id="count-tv"></span></h2>
                <div class="apps-row" id="row-tv" data-key="tv">
                    <div class="loading">Chargement…</div>
                </div>
            </section>
            <section class="section">
                <h2 class="section-title">Entertainment <span class="section-count" id="count-entertainment"></span></h2>
                <div class="apps-row" id="row-entertainment" data-key="entertainment">
                    <div class="loading">Chargement…</div>
                </div>
            </section>
        </main>

        <!-- Footer / status -->
        <footer class="footer">
            <span id="status">Prêt</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
